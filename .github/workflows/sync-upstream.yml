name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/Pathos14489/Pantella.git
          git fetch upstream
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SYNC_BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$SYNC_BRANCH"

          if git merge --no-edit upstream/main; then
            echo "::notice::Clean merge — fast-forwarding main"
            git checkout main
            git merge --ff-only "$SYNC_BRANCH"
            git push origin main
            git branch -d "$SYNC_BRANCH"
          else
            echo "::warning::Merge conflict — pushing sync branch and opening PR for human review"
            git add -A
            git commit --no-edit || echo "::warning::Nothing to commit"
            git push -u origin "$SYNC_BRANCH"
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -20 || true)
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(sync): merge upstream/main — manual resolution required" \
              --body "Automated upstream sync produced merge conflicts. Human review required.

          \`\`\`
          $CONFLICTS
          \`\`\`"
          fi
