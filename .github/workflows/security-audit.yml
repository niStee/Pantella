name: Security Audit

on:
  pull_request:
    branches: [main, master, dev/pantella-wow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.10'
      - name: Install security tools
        run: |
          pip install --no-deps --require-hashes -r requirements-security.txt
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt -r launcher_requirements.txt --format=json --output=pip-audit-results.json || true
          pip-audit -r requirements.txt -r launcher_requirements.txt --format=summary 2>&1 | tee pip-audit-results.txt || true
          echo "## pip-audit findings" >> "$GITHUB_STEP_SUMMARY"
          cat pip-audit-results.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-results
          path: pip-audit-results.*
          retention-days: 30

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.10'
      - name: Install security tools
        run: |
          pip install --no-deps --require-hashes -r requirements-security.txt
      - name: Run bandit
        continue-on-error: true
        run: |
          bandit -r src/ -f txt -o bandit-results.txt || true
          echo "## Bandit findings" >> "$GITHUB_STEP_SUMMARY"
          cat bandit-results.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-results
          path: bandit-results.txt
          retention-days: 30

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Run Semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep --config=p/security-audit \
                  --config=p/owasp-top-ten \
                  --config=p/cwe-top-25 \
                  --config=p/python \
                  --error \
                  src/ \
                  2>&1 | tee semgrep-results.txt || true
          echo "## Semgrep findings" >> "$GITHUB_STEP_SUMMARY"
          cat semgrep-results.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-results
          path: semgrep-results.txt
          retention-days: 30

  dependency-review:
    name: Dependency change review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Dependency Review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4
